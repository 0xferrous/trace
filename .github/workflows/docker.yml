name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Docker images
        run: |
          nix build .#docker-image-cli
          cp result result-cli
          nix build .#docker-image-backend
          cp result result-backend

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          CLI_TAG="${REGISTRY}/${IMAGE_NAME}-cli:latest"
          BACKEND_TAG="${REGISTRY}/${IMAGE_NAME}-backend:latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            CLI_TAG="${REGISTRY}/${IMAGE_NAME}-cli:${VERSION}"
            BACKEND_TAG="${REGISTRY}/${IMAGE_NAME}-backend:${VERSION}"
          fi
          echo "cli-tag=${CLI_TAG}" >> $GITHUB_OUTPUT
          echo "backend-tag=${BACKEND_TAG}" >> $GITHUB_OUTPUT

      - name: Load and push Docker images
        if: github.event_name != 'pull_request'
        run: |
          # Load and push CLI image
          docker load < result-cli
          docker tag traces-cli:latest ${{ steps.meta.outputs.cli-tag }}
          docker push ${{ steps.meta.outputs.cli-tag }}

          # Load and push backend image
          docker load < result-backend
          docker tag traces-backend:latest ${{ steps.meta.outputs.backend-tag }}
          docker push ${{ steps.meta.outputs.backend-tag }}

          # Also push latest tags on main/master branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            docker tag traces-cli:latest ${REGISTRY}/${IMAGE_NAME}-cli:latest
            docker push ${REGISTRY}/${IMAGE_NAME}-cli:latest
            docker tag traces-backend:latest ${REGISTRY}/${IMAGE_NAME}-backend:latest
            docker push ${REGISTRY}/${IMAGE_NAME}-backend:latest
          fi
