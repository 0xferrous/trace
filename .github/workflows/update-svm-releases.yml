name: Update SVM Releases List Hash

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-hash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fetch new hash
        id: fetch
        run: |
          URL="https://binaries.soliditylang.org/linux-amd64/list.json"

          # Fetch the file and calculate the hash
          NEW_HASH=$(nix-prefetch-url "$URL" 2>&1 | grep -v '^path is' | tail -n1)

          # Convert to SRI format (sha256-...)
          NEW_HASH_SRI=$(nix hash convert --to sri --type sha256 "$NEW_HASH" 2>/dev/null || nix hash to-sri --type sha256 "$NEW_HASH" 2>&1 | grep -v '^warning:')

          # Extract current hash from flake.nix
          CURRENT_HASH=$(grep -A1 'url = "https://binaries.soliditylang.org/linux-amd64/list.json"' flake.nix | grep 'sha256 =' | sed 's/.*sha256 = "\([^"]*\)".*/\1/')

          echo "current_hash=$CURRENT_HASH" >> $GITHUB_OUTPUT
          echo "new_hash=$NEW_HASH_SRI" >> $GITHUB_OUTPUT

          if [ "$CURRENT_HASH" != "$NEW_HASH_SRI" ]; then
            echo "hash_changed=true" >> $GITHUB_OUTPUT
            echo "Hash changed from $CURRENT_HASH to $NEW_HASH_SRI"
          else
            echo "hash_changed=false" >> $GITHUB_OUTPUT
            echo "Hash unchanged: $CURRENT_HASH"
          fi

      - name: Update flake.nix
        if: steps.fetch.outputs.hash_changed == 'true'
        run: |
          CURRENT_HASH="${{ steps.fetch.outputs.current_hash }}"
          NEW_HASH="${{ steps.fetch.outputs.new_hash }}"

          # Update the hash in flake.nix
          sed -i "s|sha256 = \"$CURRENT_HASH\"|sha256 = \"$NEW_HASH\"|" flake.nix

          # Verify the change was made
          if grep -q "$NEW_HASH" flake.nix; then
            echo "Successfully updated hash in flake.nix"
          else
            echo "Failed to update hash in flake.nix"
            exit 1
          fi

      - name: Create Pull Request
        if: steps.fetch.outputs.hash_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update SVM releases list hash"
          title: "chore: update SVM releases list hash"
          body: |
            ## Automated Hash Update

            This PR updates the hash for the SVM releases list JSON file.

            - **URL**: https://binaries.soliditylang.org/linux-amd64/list.json
            - **Old hash**: `${{ steps.fetch.outputs.current_hash }}`
            - **New hash**: `${{ steps.fetch.outputs.new_hash }}`

            This change was automatically detected and generated by the update-svm-releases workflow.
          branch: automated/update-svm-releases-hash
          delete-branch: true
          labels: |
            automated
            dependencies
