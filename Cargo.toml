ratzilla = { git = "https://github.com/0xferrous/ratzilla", rev = "6f9c85729d8c2c75c89aa4ce78f5c63d6a86ba6f" }
ratatui = { git = "https://github.com/0xferrous/ratatui", rev = "fdea0bb0cb55cde4b94c706227bac692f0375865" }
