[workspace]
members = ["crates/cli", "crates/tui-app", "crates/web"]
default-members = ["crates/cli", "crates/tui-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
alloy-primitives = "1.4"
ansi-to-tui = "8.0.0"
clap = { version = "4.5.53", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
eyre = "0.6.12"
ratatui = "0.30.0"
revm-inspectors = { version = "0.33.2" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"

# Workspace member crates
tui-app = { path = "crates/tui-app" }

