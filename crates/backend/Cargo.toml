[package]
name = "trace-backend"
version.workspace = true
edition.workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
eyre.workspace = true
futures.workspace = true

dashmap = "6.1.0"
url = "2.5.8"
axum = { version = "0.8.8" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
tower-http = { version = "0.6.8", features = ["trace"] }

alloy-consensus = { version = "1.3.0" }
alloy-network = { version = "1.3.0" }
alloy-primitives = { version = "1.3.0" }
alloy-provider = { version = "1.3.0" }
alloy-rpc-types = { version = "1.3.0" }
alloy-rpc-types-trace = { version = "1.3.0" }
alloy-chains = { version = "0.2.24" }
alloy-rpc-client = { version = "1.3.0" }
alloy-json-rpc = { version = "1.3.0" }
foundry-config = { git = "https://github.com/foundry-rs/foundry", branch = "master" }
foundry-evm = { git = "https://github.com/foundry-rs/foundry", branch = "master" }
revm-inspectors = { version = "0.33.2" }
